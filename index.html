<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Material Icons CDN (Outlined) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>My Website</title>
</head>
<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar (Collapsible Sidebar) -->
        <nav id="sidebar" class="bg-light border-end p-4 position-relative" style="width: 260px; transition: margin-left 0.3s;">
            <button id="sidebarShowBtn" class="btn btn-primary d-md-none mb-3 position-fixed top-0 start-0" type="button" aria-label="Show sidebar" style="z-index:3; margin: 10px; display: none;">
                <span class="material-icons-outlined">menu</span>
            </button>
            <button id="sidebarToggle" class="btn btn-outline-primary d-md-none mb-3 position-absolute top-0 end-0" type="button" aria-label="Toggle sidebar" style="z-index:2;">
                <span class="material-icons-outlined">close</span>
            </button>
            <div id="sidebarContent">
                <h2 class="fs-4 fw-bold mb-4 text-primary">Navigation</h2>
                <ul class="nav flex-column gap-3" id="sidebarNavList">
                    <li class="nav-item">
                        <a href="#" class="nav-link d-flex align-items-center text-dark">
                            <span class="material-icons-outlined text-primary me-2">home</span>
                            <span class="sidebar-label">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link d-flex align-items-center text-dark">
                            <span class="material-icons-outlined text-primary me-2">person</span>
                            <span class="sidebar-label">About</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link d-flex align-items-center text-dark">
                            <span class="material-icons-outlined text-primary me-2">work</span>
                            <span class="sidebar-label">Services</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link d-flex align-items-center text-dark">
                            <span class="material-icons-outlined text-primary me-2">mail</span>
                            <span class="sidebar-label">Contact</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- Main Content -->
        <div class="flex-grow-1 d-flex flex-column">
            <header class="bg-primary text-white text-center py-4 mb-4">
                <h1 class="display-5 fw-bold">Welcome to My Website</h1>
            </header>
            <main class="container text-center flex-grow-1">
                <p class="fs-5 mb-3">This is a website set up with HTML, CSS, and JavaScript.</p>
                <button id="clickMeBtn" class="btn btn-success mb-3">Click Me!</button>
                <div id="message" class="mt-3 text-primary fw-semibold"></div>
            </main>
            <footer class="bg-dark text-white text-center py-3 mt-4">
                <p class="mb-0">&copy; 2025 My Website</p>
            </footer>
        </div>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <!-- All inline JavaScript has been moved to script.js -->
</body>
</html>
