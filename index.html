<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Material Icons CDN (Outlined) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>My Website</title>
</head>
<body data-bs-theme="auto" class="d-flex">

    <!-- Sidebar -->
    <nav id="sidebar" class="bg-body d-flex flex-column border-end p-3">
        <div class="d-flex gap-1 align-items-center mx-2">
            <button id="sidebarCollapser" class="btn d-flex justify-content-center align-items-center p-0 border-0 shadow-none">
                <span class="material-icons-outlined text-primary-emphasis pl-2 py-1">menu</span>
            </button>
            <h2 class="fs-4 mb-0">Navigation</h2>
        </div>
        <hr>
        <ul id="navigation-list" class="nav flex-column gap-2">
            <li class="navigation-item">
                <a href="#" class="nav-link d-flex gap-2 border">
                    <span class="navigation-icon material-icons-outlined align-items-center">home</span>
                    <span class="navigation-label">Home</span>
                </a>
            </li>
            <li class="navigation-item">
                <a href="#" class="nav-link d-flex gap-2 border">
                    <span class="navigation-icon material-icons-outlined align-items-center">person</span>
                    <span class="navigation-label">About</span>
                </a>
            </li>
            <li class="navigation-item">
                <a href="#" class="nav-link d-flex gap-2 border">
                    <span class="navigation-icon material-icons-outlined align-items-center">mail</span>
                    <span class="navigation-label">Contact</span>
                </a>
            </li>
        </ul>
        <hr>
        <div class="flex-grow-1"></div>
        <hr>
        <button id="theme-switcher" class="btn d-flex justify-content-center align-items-center p-0 mx-2" style="width: 24px; height: 24px;">
            <span class="material-icons-outlined fs-4">dark_mode</span>
        </button>
    </nav>

    <div class="d-flex flex-column flex-grow-1">
        <!-- Main Content -->
        <div class="bg-gradient d-flex flex-column flex-grow-1 gap-2 p-2">
            <header class="bg-primary bg-gradient text-white d-flex justify-content-center align-items-center p-4 rounded-2">
                <h1 class="fw-bold mb-0 text-center">Hello</h1>
            </header>
            <main class="bg-body border flex-grow-1 p-4 rounded-2">
                <p class="">This is a website set up with HTML, CSS, and JavaScript.</p>
                <button id="clickMeBtn" class="btn btn-success">Click Me!</button>
                <div id="message" class="text-primary-emphasis fw-semibold"></div>
            </main>
        </div>        
        <footer class="bg-body border-top">
            <p class="mb-0 text-end">&copy; 2025 My Website</p>
        </footer>
    </div>

    
    <!-- Javascript Links -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
